name: Release Multiplatform App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Release Metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Determine Version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref_name }}" == v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v1.0.0"
          fi
          VER="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "Target Release Tag: $TAG (version: $VER)"

  build-android:
    name: Build Android APK (arm64, armv7, x86, x86_64, all)
    needs: prepare
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android Release APKs
        run: ./gradlew :androidApp:assembleRelease

      - name: Sign Android APKs
        shell: bash
        run: |
          mkdir -p output
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)

          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Signing with secret keystore..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.jks
            KS_PASS="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}"
            KEY_PASS="${{ secrets.ANDROID_KEY_PASSWORD }}"
          else
            echo "Generating release signing key for GitHub release..."
            keytool -genkeypair -v \
              -keystore release.jks \
              -alias saolei \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "saolei123" \
              -keypass "saolei123" \
              -dname "CN=Saolei, OU=Saolei, O=Saolei, L=Unknown, ST=Unknown, C=CN"
            KS_PASS="saolei123"
            KEY_ALIAS="saolei"
            KEY_PASS="saolei123"
          fi

          for APK in androidApp/build/outputs/apk/release/*.apk; do
            [ -f "$APK" ] || continue
            BASENAME=$(basename "$APK")
            case "$BASENAME" in
              *arm64-v8a*) ARCH_TAG="arm64" ;;
              *armeabi-v7a*) ARCH_TAG="armv7" ;;
              *x86_64*) ARCH_TAG="x86_64" ;;
              *x86*) ARCH_TAG="x86" ;;
              *universal*) ARCH_TAG="all" ;;
              *) ARCH_TAG="all" ;;
            esac

            OUT_APK="output/Saolei-Android-${ARCH_TAG}-${TAG}.apk"
            echo "Signing $APK -> $OUT_APK"
            $BUILD_TOOLS_DIR/apksigner sign \
              --ks release.jks \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KS_PASS" \
              --key-pass "pass:$KEY_PASS" \
              --out "$OUT_APK" \
              "$APK"
          done

          echo "=== Generated Signed Android APKs ==="
          ls -lh output/

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-artifact
          path: output/*
          retention-days: 1

  build-desktop-windows:
    name: Build Windows Desktop (x64 MSI & EXE)
    needs: prepare
    runs-on: windows-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Packaging Tools (WiX and Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            if (Test-Path "C:\Program Files (x86)\WiX Toolset v3.11\bin") {
              "C:\Program Files (x86)\WiX Toolset v3.11\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              Write-Host "Added pre-installed WiX to PATH"
            } else {
              Write-Host "Installing WiX via Chocolatey..."
              choco install wixtoolset -y
            }
          }
          choco install innosetup -y
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6") {
            "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Package Windows Distributions
        shell: pwsh
        run: .\gradlew.bat :desktopApp:packageReleaseDistributionForCurrentOS :desktopApp:packageReleaseMsi :desktopApp:packageReleaseExe :desktopApp:createReleaseDistributable --stacktrace

      - name: Print JPackage Error Logs on Failure
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem -Path desktopApp/build/compose/logs -Recurse -Filter *.txt | ForEach-Object {
            Write-Host "=== Log: $($_.FullName) ==="
            Get-Content $_.FullName
          }

      - name: Collect Windows Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output

          Write-Host "=== All files in desktopApp/build/compose/binaries ==="
          Get-ChildItem -Path desktopApp/build/compose/binaries -Recurse | ForEach-Object {
            Write-Host "$($_.FullName) (Length: $($_.Length) bytes)"
          }

          # 1. Collect MSI installer (approx 65 MB)
          $msi = Get-ChildItem -Path desktopApp/build/compose/binaries -Recurse -Filter *.msi | Select-Object -First 1
          if ($msi) {
            Copy-Item $msi.FullName -Destination "output/Saolei-Windows-x64-$($env:TAG).msi"
            Write-Host "Collected MSI installer: $($msi.FullName) ($($msi.Length) bytes)"
          } else {
            Write-Warning "No MSI installer found!"
          }

          # 2. Collect EXE installer (must NOT be the 579KB launcher stub in app/Saolei/)
          $installerExe = Get-ChildItem -Path desktopApp/build/compose/binaries -Recurse -Filter *.exe | Where-Object {
            $_.FullName -notmatch '[\\/]app[\\/]'
          } | Select-Object -First 1

          if ($installerExe) {
            Copy-Item $installerExe.FullName -Destination "output/Saolei-Windows-x64-$($env:TAG).exe"
            Write-Host "Collected EXE installer: $($installerExe.FullName) ($($installerExe.Length) bytes)"
          } else {
            Write-Host "No standalone EXE installer found in exe/ folder."
          }

          # 3. Collect Portable application directory (contains Saolei.exe, runtime, and app)
          $portableDir = Get-ChildItem -Path desktopApp/build/compose/binaries -Recurse -Directory | Where-Object {
            (Test-Path (Join-Path $_.FullName "runtime")) -and (Test-Path (Join-Path $_.FullName "app"))
          } | Select-Object -First 1

          if ($portableDir) {
            Write-Host "Found Portable Application Directory: $($portableDir.FullName)"

            # Package portable ZIP using 7z (or Compress-Archive)
            if (Get-Command 7z -ErrorAction SilentlyContinue) {
              Write-Host "Creating portable zip with 7z..."
              & 7z a -tzip -mx=5 "output/Saolei-Windows-x64-$($env:TAG)-portable.zip" "$($portableDir.FullName)\*"
            } else {
              Write-Host "Creating portable zip with Compress-Archive..."
              Compress-Archive -Path "$($portableDir.FullName)\*" -DestinationPath "output/Saolei-Windows-x64-$($env:TAG)-portable.zip" -Force
            }
            Write-Host "Created Portable Zip: output/Saolei-Windows-x64-$($env:TAG)-portable.zip"

            # Fallback: if no installer EXE was produced by WiX/jpackage, generate a self-extracting single-file portable EXE
            if (-not (Test-Path "output/Saolei-Windows-x64-$($env:TAG).exe")) {
              Write-Host "Creating self-extracting single-file EXE with 7z..."
              & 7z a -sfx "output/Saolei-Windows-x64-$($env:TAG).exe" "$($portableDir.FullName)\*"
              Write-Host "Created SFX Portable EXE: output/Saolei-Windows-x64-$($env:TAG).exe"
            }
          } else {
            Write-Warning "Could not find portable application directory!"
          }

          # 4. Rigorous validation: output EXE MUST NOT be a bare launcher stub (< 5MB)
          if (Test-Path "output/Saolei-Windows-x64-$($env:TAG).exe") {
            $outputExe = Get-Item "output/Saolei-Windows-x64-$($env:TAG).exe"
            Write-Host "Verified Output EXE: $($outputExe.FullName) ($($outputExe.Length) bytes)"
            if ($outputExe.Length -lt 5000000) {
              Write-Error "CRITICAL ERROR: Windows EXE size ($($outputExe.Length) bytes) is too small! Expected complete bundle (> 5MB)."
              exit 1
            }
          } else {
            Write-Error "CRITICAL ERROR: No Windows EXE was produced!"
            exit 1
          }

          Write-Host "=== Final Windows Artifacts ==="
          Get-ChildItem -Path output | ForEach-Object {
            Write-Host "$($_.Name) ($($_.Length) bytes)"
          }

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: output/*
          retention-days: 1

  build-desktop-macos-intel:
    name: Build macOS Desktop (Intel x86_64 DMG)
    needs: prepare
    runs-on: macos-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (x64 for Intel via Rosetta 2)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          architecture: 'x64'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Package macOS Intel DMG
        run: arch -x86_64 ./gradlew :desktopApp:packageReleaseDistributionForCurrentOS --stacktrace

      - name: Collect macOS Intel Artifacts
        shell: bash
        run: |
          mkdir -p output
          DMG_FILE=$(find desktopApp/build/compose/binaries -name "*.dmg" | head -n 1)
          if [ -n "$DMG_FILE" ]; then
            cp "$DMG_FILE" "output/Saolei-macOS-Intel-x86_64-${TAG}.dmg"
            echo "Found Intel DMG: $DMG_FILE"
          else
            echo "Error: DMG file not found!"
            exit 1
          fi

      - name: Upload macOS Intel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel-artifact
          path: output/*
          retention-days: 1

  build-desktop-macos-arm64:
    name: Build macOS Desktop (Apple Silicon arm64 DMG)
    needs: prepare
    runs-on: macos-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Apple Silicon arm64)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          architecture: 'aarch64'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Package macOS Apple Silicon DMG
        run: ./gradlew :desktopApp:packageReleaseDistributionForCurrentOS --stacktrace

      - name: Collect macOS Apple Silicon Artifacts
        shell: bash
        run: |
          mkdir -p output
          DMG_FILE=$(find desktopApp/build/compose/binaries -name "*.dmg" | head -n 1)
          if [ -n "$DMG_FILE" ]; then
            cp "$DMG_FILE" "output/Saolei-macOS-AppleSilicon-arm64-${TAG}.dmg"
            echo "Found Apple Silicon DMG: $DMG_FILE"
          else
            echo "Error: DMG file not found!"
            exit 1
          fi

      - name: Upload macOS Apple Silicon Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-artifact
          path: output/*
          retention-days: 1

  build-desktop-linux:
    name: Build Linux Desktop (AppImage, DEB & Universal JAR)
    needs: prepare
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Linux Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg curl libfuse2 file desktop-file-utils

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Distributable and Linux Packages
        run: ./gradlew :desktopApp:createReleaseDistributable :desktopApp:packageReleaseDistributionForCurrentOS :desktopApp:packageReleaseUberJarForCurrentOS --stacktrace

      - name: Package Linux AppImage
        shell: bash
        run: |
          set -e
          mkdir -p output

          APP_DIR_SOURCE=$(find desktopApp/build/compose/binaries/main-release/app -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -z "$APP_DIR_SOURCE" ]; then
            APP_DIR_SOURCE=$(find desktopApp/build/compose/binaries -type d -name "app" -exec find {} -mindepth 1 -maxdepth 1 -type d \; | head -n 1)
          fi
          echo "Found application directory: $APP_DIR_SOURCE"

          mkdir -p AppDir/usr/bin AppDir/usr/lib AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp -r "$APP_DIR_SOURCE/"* AppDir/usr/

          LAUNCHER=$(find AppDir/usr/bin -maxdepth 1 -type f -perm /111 | head -n 1)
          if [ -z "$LAUNCHER" ]; then
            LAUNCHER=$(find AppDir/usr -maxdepth 2 -type f -perm /111 | head -n 1)
          fi
          EXE_NAME=$(basename "$LAUNCHER")
          echo "Found launcher executable: $EXE_NAME"

          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "$HERE/usr/bin/LAUNCHER_NAME" "$@"
          EOF
          sed -i "s/LAUNCHER_NAME/$EXE_NAME/g" AppDir/AppRun
          chmod +x AppDir/AppRun

          cat << EOF > AppDir/saolei.desktop
          [Desktop Entry]
          Type=Application
          Name=Saolei
          GenericName=Minesweeper
          Comment=Minesweeper
          Exec=$EXE_NAME
          Icon=saolei
          Categories=Game;LogicGame;
          Terminal=false
          EOF
          cp AppDir/saolei.desktop AppDir/usr/share/applications/saolei.desktop

          cp desktopApp/src/main/resources/icon.png AppDir/saolei.png
          cp desktopApp/src/main/resources/icon.png AppDir/.DirIcon
          cp desktopApp/src/main/resources/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/saolei.png

          echo "Downloading appimagetool..."
          curl -fsSL "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -o appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract

          echo "Generating AppImage..."
          ARCH=x86_64 ./squashfs-root/AppRun --no-appstream AppDir "output/Saolei-Linux-x86_64-${TAG}.AppImage"
          chmod +x "output/Saolei-Linux-x86_64-${TAG}.AppImage"

          DEB_FILE=$(find desktopApp/build/compose/binaries -name "*.deb" | head -n 1)
          if [ -n "$DEB_FILE" ]; then
            cp "$DEB_FILE" "output/Saolei-Linux-${TAG}.deb"
            echo "Found DEB: $DEB_FILE"
          fi

          JAR_FILE=$(find desktopApp/build/compose/jars -name "*.jar" | head -n 1)
          if [ -n "$JAR_FILE" ]; then
            cp "$JAR_FILE" "output/Saolei-Desktop-universal-${TAG}.jar"
            echo "Found Universal JAR: $JAR_FILE"
          fi

          echo "=== Linux Output Files ==="
          ls -lh output/

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifact
          path: output/*
          retention-days: 1

  build-ios:
    name: Build iOS Package (IPA & App Bundle)
    needs: prepare
    runs-on: macos-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Xcode Archive
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/iosApp.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package iOS Artifacts
        shell: bash
        run: |
          mkdir -p output Payload
          APP_PATH="build/iosApp.xcarchive/Products/Applications/Saolei.app"
          if [ -d "$APP_PATH" ]; then
            cp -r "$APP_PATH" Payload/
            zip -qr "output/Saolei-iOS-arm64-${TAG}-unsigned.ipa" Payload
            (cd build/iosApp.xcarchive/Products/Applications && zip -qr "$GITHUB_WORKSPACE/output/Saolei-iOS-${TAG}.app.zip" Saolei.app)
            echo "iOS packages created successfully."
          else
            echo "Error: Saolei.app not found in xcarchive!"
            exit 1
          fi

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-artifact
          path: output/*
          retention-days: 1

  build-web:
    name: Build Web App (Wasm Bundle)
    needs: prepare
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Web Application
        run: ./gradlew :webApp:wasmJsBrowserDistribution

      - name: Package Web Distribution
        shell: bash
        run: |
          mkdir -p output
          DIST_DIR="webApp/build/dist/wasmJs/productionExecutable"
          if [ -d "$DIST_DIR" ]; then
            (cd "$DIST_DIR" && zip -qr "$GITHUB_WORKSPACE/output/Saolei-Web-${TAG}.zip" .)
            echo "Web bundle created successfully."
          else
            echo "Error: Web distribution directory not found!"
            exit 1
          fi

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-artifact
          path: output/*
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs:
      - prepare
      - build-android
      - build-desktop-windows
      - build-desktop-macos-intel
      - build-desktop-macos-arm64
      - build-desktop-linux
      - build-ios
      - build-web
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Organize Release Assets and Generate Checksums
        shell: bash
        run: |
          mkdir -p release-assets
          find all-artifacts -type f -exec cp {} release-assets/ \;
          echo "=== Release Assets ==="
          ls -lh release-assets/

          cd release-assets
          sha256sum * > checksums.txt
          echo "=== Checksums ==="
          cat checksums.txt

      - name: Generate Release Body
        shell: bash
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          git log -1 --format="%B" > commit_msg.txt
          TAG_ANNOTATION=$(git tag -l --format="%(contents)" "${TAG}" 2>/dev/null || true)

          cat << EOF > release_body.md
          ## 💣 经典扫雷 Minesweeper 全平台 Release (${TAG})

          欢迎体验基于 **Compose Multiplatform** 打造的全平台现代扫雷游戏！针对主流操作系统与芯片架构进行了精细分包编译。

          ### 📝 本次版本更新说明 / Commit Message (\`${COMMIT_HASH}\`)

          EOF

          cat commit_msg.txt >> release_body.md

          if [ -n "$TAG_ANNOTATION" ]; then
            cat << EOF >> release_body.md

          ### 🏷️ 标签附注说明 / Tag Note

          $TAG_ANNOTATION
          EOF
          fi

          cat << 'EOF' >> release_body.md

          ---

          ### 📦 各平台与系统架构安装包列表

          #### 📱 Android 平台
          | 文件名 | 适用架构 / 说明 |
          | :--- | :--- |
          | `Saolei-Android-arm64-${{ env.TAG }}.apk` | **ARM 64位**（绝大多数现代 Android 手机/平板，性能更优、体积更小） |
          | `Saolei-Android-armv7-${{ env.TAG }}.apk` | **ARM 32位**（老旧安卓手机或低配嵌入式设备） |
          | `Saolei-Android-x86_64-${{ env.TAG }}.apk` | **x86 64位**（PC 上的安卓模拟器、ChromeOS、车机等） |
          | `Saolei-Android-x86-${{ env.TAG }}.apk` | **x86 32位**（部分老版 32位 PC 模拟器） |
          | `Saolei-Android-all-${{ env.TAG }}.apk` | **全架构 Universal 整合包**（包含所有架构，可在任意 Android 设备安装） |

          #### 🪟 Windows 平台
          | 文件名 | 适用架构 / 说明 |
          | :--- | :--- |
          | `Saolei-Windows-x64-${{ env.TAG }}.msi` | **Windows 64位 MSI 安装包**（主流 Intel/AMD 处理器，包含 Windows 11 ARM64 模拟） |
          | `Saolei-Windows-x64-${{ env.TAG }}.exe` | **Windows 64位 独立安装向导包** |
          | `Saolei-Windows-x64-${{ env.TAG }}-portable.zip` | **Windows 64位 独立便携运行包**（解压即开即玩） |

          #### 🍎 macOS 平台
          | 文件名 | 适用芯片架构 / 说明 |
          | :--- | :--- |
          | `Saolei-macOS-AppleSilicon-arm64-${{ env.TAG }}.dmg` | **Apple Silicon 原生版**（适用于 M1 / M2 / M3 / M4 等芯片的 Mac） |
          | `Saolei-macOS-Intel-x86_64-${{ env.TAG }}.dmg` | **Intel 常规版**（适用于配备 Intel Core 处理器的传统 Mac） |

          #### 🐧 Linux 平台
          | 文件名 | 格式 / 说明 |
          | :--- | :--- |
          | `Saolei-Linux-x86_64-${{ env.TAG }}.AppImage` | **AppImage 通用独立运行包**（赋予执行权限直接运行，兼容 Ubuntu/Debian/Fedora/Arch 等所有发行版） |
          | `Saolei-Linux-${{ env.TAG }}.deb` | **Debian / Ubuntu 安装包** (`sudo dpkg -i ...`) |
