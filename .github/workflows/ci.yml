name: Continuous Integration

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'doc/**'
      - '.gitignore'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-verify:
    name: Run Tests and Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Gradle Unit Tests & Checks
        run: ./gradlew check -x wasmJsBrowserTest -x jsBrowserTest

      - name: Build Android Release
        run: ./gradlew :androidApp:assembleRelease

      - name: Build Web App
        run: ./gradlew :webApp:wasmJsBrowserDistribution
